sitl:
  address: 127.0.0.1
  motor_port: 9002
  fdm_port: 9003
  rc_port: 9004

gazebo:
  imu_topic: /imu
  altimeter_topic: /altimeter
  navsat_topic: /navsat
  actuator_topic: /X3/gazebo/command/motor_speed

fdm:
  rate_hz: 500
  frame_mode: gazebo_bridge
  pressure_mode: from_altitude
  altitude_source: altimeter
  sea_level_pressure_pa: 101325.0

motors:
  input: normalized_9002
  map: [1, 2, 3, 0]
  min_rotor_velocity_rad_s: 0.0
  max_rotor_velocity_rad_s: 1000.0
  timeout_seconds: 0.10
  publish_zero_on_timeout: true

mavlink:
  address: 127.0.0.1
  port: 14550
  system_id: 1
  component_id: 158

odometry:
  enable: true
  gazebo_topic: /model/X3/odometry

rangefinders:
  - name: down
    enable: true
    gazebo_topic: /X3/down_range/scan
    output: tfmini
    sitl_address: 127.0.0.1
    sitl_port: 5762

  - name: front
    enable: true
    gazebo_topic: /X3/front_range/scan
    output: mavlink
    mavlink_message: distance_sensor
    orientation: forward
    sensor_id: 0

logging:
  level: info
  status_period_seconds: 1.0
  log_first_packets: true
